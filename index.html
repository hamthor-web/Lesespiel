<style>
:root{--ink:#173d6b;--sky:#dff4ff;--cream:#fffdf6;--green:#98c95a;--blue:#65b8eb;--gold:#f3bd3f;--shadow:0 16px 44px rgba(17,52,82,.22)}
*{box-sizing:border-box}html{background:var(--sky)}body{margin:0;min-height:100%;font-family:ui-rounded,"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#dff4ff,#f5fbff 55%,#e8f7d4)}
button{font:inherit}.app{width:min(1420px,100%);margin:auto;padding:14px clamp(10px,2vw,24px) 28px}.topbar{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:10px}.title{font-size:clamp(1.4rem,3vw,2.3rem);font-weight:950;letter-spacing:-.03em}.meta{display:flex;gap:8px;align-items:center}.counter,.restart{background:rgba(255,255,255,.88);border:2px solid rgba(23,61,107,.12);border-radius:999px;color:var(--ink);font-weight:900;box-shadow:0 4px 14px rgba(23,61,107,.1)}.counter{padding:8px 13px}.restart{width:44px;height:44px;cursor:pointer;font-size:1.4rem}
.galleryWrap{background:rgba(255,255,255,.72);border:2px solid rgba(23,61,107,.09);border-radius:22px;padding:10px 8px 7px;margin-bottom:12px;box-shadow:0 6px 22px rgba(23,61,107,.09)}.galleryLabel{font-weight:900;margin:0 10px 7px;font-size:.95rem}.gallery{display:flex;gap:10px;overflow-x:auto;padding:2px 8px 8px;scroll-snap-type:x proximity;scrollbar-color:#9bcbe8 transparent}.storyPreview{width:92px;flex:0 0 92px;border:0;background:transparent;color:var(--ink);cursor:pointer;padding:4px;scroll-snap-align:start;border-radius:14px}.ring{width:72px;height:72px;margin:auto;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--green) var(--p),rgba(23,61,107,.12) 0);padding:5px;position:relative;transition:background .35s ease,transform .2s ease}.ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:white}.ring img{position:relative;z-index:1;width:58px;height:58px;border-radius:50%;object-fit:cover}.storyPreview:hover .ring,.storyPreview:focus-visible .ring{transform:translateY(-2px) scale(1.04)}.storyPreview:focus-visible{outline:3px solid #347fbd;outline-offset:2px}.storyPreview.selected{background:#fff3ad;box-shadow:0 0 0 3px rgba(236,174,45,.55)}.storyPreview.selected .ring{transform:scale(1.05)}.previewName{display:block;font-size:.78rem;font-weight:900;line-height:1.05;margin-top:4px}.check{display:none;position:absolute;z-index:2;right:-2px;bottom:-1px;width:23px;height:23px;border-radius:50%;background:#4e9c43;color:#fff;border:3px solid #fff;font-size:.8rem;line-height:17px}.storyPreview.complete .check{display:block}
.stage{position:relative;width:100%;aspect-ratio:4/3;background:url("assets/grundbild.jpg?v=2") center/cover no-repeat;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);border:4px solid rgba(255,255,255,.8)}.hotspot{position:absolute;border:0;background:transparent;border-radius:24px;cursor:pointer;touch-action:manipulation}.hotspot:focus-visible{outline:4px solid white;box-shadow:0 0 0 8px rgba(50,130,200,.75)}.hotspot.glow::after{content:"";position:absolute;inset:-3px;border-radius:inherit;border:2px solid rgba(255,255,255,.7);box-shadow:0 0 0 3px rgba(116,197,239,.18),0 0 18px 7px rgba(255,248,174,.25);animation:softGlow .7s ease-in-out 2}.hint{position:absolute;bottom:1.8%;left:50%;transform:translateX(-50%);background:rgba(255,253,246,.9);padding:7px 14px;border-radius:999px;font-size:clamp(.75rem,1.4vw,1.05rem);font-weight:900;white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,.13)}@keyframes softGlow{50%{opacity:.5;transform:scale(1.025)}}
dialog{border:0;padding:0;background:transparent;width:min(720px,94vw);max-height:94vh}dialog::backdrop{background:rgba(13,39,59,.54);backdrop-filter:blur(3px)}.searchStatus{margin:12px auto 0;width:max-content;max-width:92%;background:#fff8d5;border:2px solid rgba(236,174,45,.42);border-radius:999px;padding:8px 16px;text-align:center;font-weight:900}.searchStatus.tryAgain{animation:nudge .32s ease 2}.storyArea{margin-top:18px}.storyArea[hidden]{display:none}.card{background:var(--cream);border:6px solid #d7edb5;border-radius:30px;box-shadow:0 14px 38px rgba(23,61,107,.18);padding:15px 20px 19px}.cardTop{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:8px}.cardTop h2{margin:0;text-align:center;font-size:clamp(1.6rem,5vw,2.7rem);padding-right:44px}.step{font-weight:950;color:#47759b}.art{margin:10px auto;border-radius:22px;overflow:hidden;background:#eef8ff;aspect-ratio:3/2;max-height:520px}.art img{width:100%;height:100%;display:block;object-fit:cover}.storyText{font-size:clamp(1.2rem,3.2vw,2rem);line-height:1.38;text-align:center;font-weight:850;padding:8px 6px 12px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.actions button{border:2px solid rgba(23,61,107,.16);border-radius:17px;padding:13px 10px;color:var(--ink);font-weight:950;font-size:clamp(.92rem,2vw,1.2rem);cursor:pointer}.actions button:disabled{opacity:.42;cursor:not-allowed}.next{background:#d8efff;grid-column:1/-1}.previous{background:#eef4fa}.replay{background:#e9f5dc}.done{background:#fff5df}@keyframes nudge{50%{transform:translateX(5px)}}
.finish{display:none;text-align:center;padding:28px 10px 20px}.finish.show{display:block}.finishBadge{font-size:3rem}.finish h2{font-size:clamp(1.8rem,5vw,3rem);margin:.2em 0}.finish p{font-size:1.2rem;font-weight:800}.finish button{background:#d8efff;border:2px solid rgba(23,61,107,.18);border-radius:17px;padding:13px 22px;font-weight:950;color:var(--ink);cursor:pointer}

✓</span></span><span class="previewName">Der Pokal</span></button><button class="storyPreview" data-id="pretzel" aria-label="Emma entdecken" style="--p:0deg"><span class="ring"><img src="assets/thumb-pretzel.jpg?v=2" alt=""/><span class="check">✓</span></span><span class="previewName">Emma</span></button><button class="storyPreview" data-id="bag" aria-label="Neles grüner Rucksack entdecken" style="--p:0deg"><span class="ring"><img src="assets/thumb-bag.jpg?v=2" alt=""/><span class="check">✓</span></span><span class="previewName">Neles grüner Rucksack</span></button><button class="storyPreview" data-id="shoe" aria-label="Lukas’ roter Turnschuh entdecken" style="--p:0deg"><span class="ring"><img src="assets/thumb-shoe.jpg?v=2" alt=""/><span class="check">✓</span></span><span class="previewName">Lukas’ roter Turnschuh</span></button><button class="storyPreview" data-id="lace" aria-label="Paul entdecken" style="--p:0deg"><span class="ring"><img src="assets/thumb-lace.jpg?v=2" alt=""/><span class="check">✓</span></span><span class="previewName">Paul</span></button><button class="storyPreview" data-id="swing" aria-label="Nele entdecken" style="--p:0deg"><span class="ring"><img src="assets/thumb-swing.jpg?v=2" alt=""/><span class="check">✓</span></span><span class="previewName">Nele</span></button><button class="storyPreview" data-id="lunch" aria-label="Pauls Lunchbox entdecken" style="--p:0deg"><span class="ring"><img src="assets/thumb-lunch.jpg?v=2" alt=""/><span class="check">✓</span></span><span class="previewName">Pauls Lunchbox</span></button><button class="storyPreview" data-id="cheer" aria-label="Oskar entdecken" style="--p:0deg"><span class="ring"><img src="assets/thumb-cheer.jpg?v=2" alt=""/><span class="check">✓</span></span><span class="previewName">Oskar</span></button><button class="storyPreview" data-id="scarf" aria-label="Oskars Schal entdecken" style="--p:0deg"><span class="ring"><img src="assets/thumb-scarf.jpg?v=2" alt=""/><span class="check">✓</span></span><span class="previewName">Oskars Schal</span></button><button class="storyPreview" data-id="bottle" aria-label="Pauls blaue Flasche entdecken" style="--p:0deg"><span class="ring"><img src="assets/thumb-bottle.jpg?v=2" alt=""/><span class="check">✓</span></span><span class="previewName">Pauls blaue Flasche</span></button></div></section>

e Flasche" data-id="bottle" style="left:24%;top:64%;width:7%;height:17%"></button><div class="hint">Wähle oben und finde das Element im Bild.</div></section>

<script>
const data={"tom": {"name": "Tom", "cards": ["Tom sitzt auf dem Rasen. Er hält sein Knie fest und weint. Beim Laufen ist er gestürzt.", "Sein Knie tut weh. Tom kann erst einmal nicht weiterspielen. Er braucht eine Pause.", "Ein anderes Kind sieht Tom und setzt sich zu ihm. Nun ist Tom nicht mehr allein.", "Das Kind möchte Tom trösten. Was könnte es zu ihm sagen?", "Zu Hause erzählt Tom seiner Mutti von dem Sturz. Sie kümmert sich um ihn. Was wird sie wohl machen?"]}, "ben": {"name": "Ben", "cards": ["Ben wollte den Ball haben. Doch ein anderes Kind war schneller. Jetzt ist Ben wütend.", "Ben ballt die Hände zu Fäusten. Sein Gesicht zeigt, wie sehr er sich ärgert.", "Ben geht für einen Moment an den Rand. Dort versucht er, wieder ruhiger zu werden.", "Ein anderes Kind kommt zu Ben und fragt: „Was ist denn los?“ Was könnte Ben antworten?", "Nach einer Weile fühlt Ben sich besser. Er geht zurück zu den anderen und spielt weiter."]}, "mia": {"name": "Mia", "cards": ["Mia läuft über das Feld. Auf ihrem Trikot steht die Nummer 8. Sie möchte den Ball bekommen.", "Mia schaut zu ihrem Mitspieler. Er hat den Ball und könnte ihn zu ihr passen.", "Der Ball rollt in Mias Richtung. Sie läuft los. Ihr Zopf fliegt dabei hin und her.", "Ein anderes Kind läuft ebenfalls zum Ball. Wer wird ihn wohl zuerst erreichen?", "Mia erreicht den Ball und spielt ihn weiter. Ihre Mannschaft bleibt im Angriff."]}, "finn": {"name": "Finn", "cards": ["Finn steht im Tor. Er macht die Arme weit und wartet auf den nächsten Schuss.", "Ein Spieler schießt auf das Tor. Finn schaut genau auf den Ball und macht sich bereit.", "Der Ball kommt immer näher. Finn macht einen Schritt zur Seite und hebt die Hände.", "Jetzt muss Finn springen. Was würdest du ihm vom Spielfeldrand zurufen?", "Finn erwischt den Ball. Er hält ihn fest und freut sich über seine tolle Parade."]}, "ref": {"name": "Der Schiedsrichter", "cards": ["Der Schiedsrichter pfeift. Alle Kinder bleiben stehen und schauen zu ihm.", "Er hat genau hingesehen. Nun zeigt er auf die Stelle, an der das Spiel weitergehen soll.", "Da entdeckt der Schiedsrichter ein Kind auf dem Boden. Er unterbricht das Spiel und geht zu ihm.", "Der Schiedsrichter fragt, ob das Kind Hilfe braucht. Was könnte das Kind antworten?", "Zum Glück ist nichts Schlimmes passiert. Der Schiedsrichter erinnert alle daran, vorsichtig und fair zu spielen. Dann geht das Spiel weiter."]}, "leo": {"name": "Leo", "cards": ["Leo läuft zum Ball. Er hebt den Fuß und macht sich zum Schießen bereit.", "Leo hat den Ball erreicht. Er schaut zum Tor und sieht dort den Torwart.", "Ein anderes Kind läuft auf Leo zu. Leo muss sich schnell entscheiden.", "Soll Leo selbst schießen oder den Ball zu einem Mitspieler passen? Was meinst du?", "Leo schaut noch einmal auf und spielt den Ball zu einem freien Mitspieler. Gemeinsam greifen sie weiter an."]}, "dog": {"name": "Der Hund", "cards": ["Der Hund sitzt neben dem Spielfeld. Er schaut den Kindern aufmerksam beim Fußballspielen zu.", "Um seinen Hals trägt er ein rotes Tuch. Vielleicht gehört er zu einem der Kinder auf dem Feld.", "Als der Ball vorbeifliegt, wird der Hund ganz aufgeregt. Trotzdem bleibt er brav am Rand sitzen.", "Der Hund beobachtet ein Kind besonders genau. Welches Kind könnte zu ihm gehören?", "Nach dem Spiel darf der Hund endlich zu den Kindern laufen. Freudig begrüßt er sie mit wedelndem Schwanz."]}, "cup": {"name": "Der Pokal", "cards": ["Am Rand des Spielfeldes steht ein goldener Pokal. Er glänzt hell in der Sonne.", "Die Kinder wissen, dass der Pokal nach dem Spiel überreicht wird. Deshalb sind alle gespannt.", "Der Pokal ist nicht nur für viele Tore gedacht. Auch ein besonders faires Team könnte ihn bekommen.", "Stell dir vor, deine Mannschaft bekommt den Pokal. Wo würdest du ihn hinstellen?", "Wer einen Pokal bekommt, hat etwas ganz toll gemacht. Aber ist ein Pokal nur zum Anschauen da? Oder kann man darin auch lustige Dinge verstecken? Vielleicht kann man noch ganz andere Sachen damit machen."]}, "pretzel": {"name": "Emma", "cards": ["Emma sitzt auf der Bank. In der Hand hält sie eine Brezel.", "Während sie isst, schaut sie den Kindern beim Fußballspielen zu.", "Da setzt sich ein anderes Kind neben Emma. Es hat vom vielen Spielen großen Hunger.", "Das Kind schaut auf die Brezel. Wird Emma ihm wohl ein Stück abgeben?", "Emma bricht ein Stück ab und teilt ihre Brezel. Gemeinsam sehen die beiden das Spiel zu Ende."]}, "bag": {"name": "Neles grüner Rucksack", "cards": ["Nele stellt ihren grünen Rucksack neben der Bank ab.", "Danach läuft sie zur Schaukel hinter dem Fußballplatz.", "Während Nele schaukelt, wartet der Rucksack ruhig im Gras.", "In einer Spielpause denkt Nele an ihre Sachen. Wo steht ihr Rucksack noch einmal?", "Nele entdeckt den grünen Rucksack neben der Bank und holt ihn ab."]}, "shoe": {"name": "Lukas’ roter Turnschuh", "cards": ["Auf der Wiese liegt ein einzelner roter Turnschuh. Sein zweiter Schuh ist nirgends zu sehen.", "Wie ist der Turnschuh wohl mitten auf die Wiese gekommen?", "Lukas hatte ein Paar Turnschuhe im Rucksack. Beim Auspacken ist einer davon ins Gras gerollt.", "Nach dem Spiel sucht Lukas seinen zweiten Turnschuh. Da entdeckt er den roten Schuh neben dem Pokal.", "Lukas hebt den roten Schuh auf. Den anderen hat er schon im Rucksack. Nun ist das Paar wieder vollständig."]}, "lace": {"name": "Paul", "cards": ["Paul sitzt im Gras und bindet sorgfältig seine Schnürsenkel.", "Neben ihm steht sein roter Rucksack. Seine blaue Trinkflasche hat er auf die Bank gestellt.", "Paul zieht die Schleifen noch einmal fest. Beim Laufen sollen die Schnürsenkel nicht aufgehen.", "Nun sind beide Schuhe fest zugebunden. Was wird Paul wohl als Nächstes machen?", "Paul steht auf, nimmt den Ball und läuft zu den anderen auf den Fußballplatz."]}, "swing": {"name": "Nele", "cards": ["Hinter dem Fußballplatz sitzt Nele auf der Schaukel. Langsam schwingt sie vor und zurück.", "Mit jedem Schwung kommt Nele ein kleines Stück höher. Von dort kann sie den Fußballplatz sehen.", "Vom Spielfeld hört sie lautes Rufen und Jubeln. Neugierig schaut Nele zu den anderen hinüber.", "Ein Kind vom Fußballplatz winkt zur Schaukel. Wem könnte es wohl winken?", "Nele winkt zurück. Dann lässt sie die Schaukel langsam auspendeln und läuft zu den anderen."]}, "lunch": {"name": "Pauls Lunchbox", "cards": ["Vor dem Spiel stellt Paul seine Lunchbox auf die Wiese. Oben darauf liegt ein roter Apfel.", "Dann läuft Paul zu den anderen Kindern auf den Fußballplatz.", "Nach dem vielen Rennen bekommt Paul Hunger. In der Pause geht er zu seiner Lunchbox.", "Paul öffnet den Deckel. Was könnte er außer dem Apfel noch eingepackt haben?", "Ein anderes Kind setzt sich zu Paul. Gemeinsam essen sie und erzählen vom Spiel."]}, "cheer": {"name": "Oskar", "cards": ["Hinten am Tor steht Oskar. Plötzlich reißt er beide Arme in die Luft und jubelt.", "Seine Mannschaft hat gerade ein tolles Tor geschossen. Oskar freut sich riesig.", "Vom Rand aus feuert er die Mannschaft weiter an. Die Kinder auf dem Feld hören seine Stimme.", "Was könnte Oskar den Spielern zurufen?", "Einige Spieler schauen zu Oskar herüber und winken. Dann geht das Spiel weiter."]}, "scarf": {"name": "Oskars Schal", "cards": ["Oskar trägt einen blau-weißen Schal und schaut beim Fußballspiel zu.", "Beim Anfeuern wird ihm warm. Deshalb legt er den Schal über die Bank.", "Als seine Mannschaft ein tolles Tor schießt, reißt Oskar die Arme hoch und jubelt.", "Nach dem Spiel sucht Oskar seinen Schal. Wo hatte er ihn noch einmal hingelegt?", "Da entdeckt Oskar den Schal auf der Bank. Zufrieden legt er ihn wieder um."]}, "bottle": {"name": "Pauls blaue Flasche", "cards": ["Auf der Bank steht Pauls blaue Trinkflasche. Er hat sie vor dem Spiel dort abgestellt.", "Paul läuft viel über den Fußballplatz. Dabei wird ihm warm und er bekommt Durst.", "In der Pause geht Paul zur Bank und trinkt erst einmal ein paar Schlucke.", "Die Kinder sind durstig vom Spielen. Pauls Wasser reicht auch für die anderen.", "Die Kinder trinken ein paar Schlucke Wasser. Nun geht es ihnen besser und sie sind wieder bereit für das Spiel."]}};
const ids=Object.keys(data), total=ids.reduce((n,id)=>n+data[id].cards.length,0), STORAGE='fussballgeschichten-neu-v1';
const storyArea=document.getElementById('storyArea'), title=document.getElementById('storyTitle'), image=document.getElementById('storyImage'), storyText=document.getElementById('storyText'), step=document.getElementById('step'), next=document.getElementById('next'), previous=document.getElementById('previous'), count=document.getElementById('count'), searchStatus=document.getElementById('searchStatus');
let current=null,selected=null,currentIndex=0;
function fresh(){return {decks:Object.fromEntries(ids.map(id=>[id,{pos:0}])),seen:[]}}
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE));if(x&&x.decks)return x}catch(e){}return fresh()}
let state=load();
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function update(){count.textContent=`${state.seen.length} von ${total}`;ids.forEach(id=>{const p=Math.min(5,state.decks[id]?.pos||0),b=document.querySelector(`.storyPreview[data-id="${id}"]`);b.style.setProperty('--p',`${p/5*360}deg`);b.classList.toggle('complete',p===5)});if(state.seen.length===total&&!sessionStorage.getItem(STORAGE+'-celebrated')){sessionStorage.setItem(STORAGE+'-celebrated','1');setTimeout(()=>document.getElementById('finishDialog').showModal(),400)}}
function show(id,scroll=true,index=null){current=id;const deck=state.decks[id]||(state.decks[id]={pos:0});currentIndex=index===null?Math.min(deck.pos,4):index;const idx=currentIndex;title.textContent=data[id].name;storyText.textContent=data[id].cards[idx];image.src=`assets/${id}-${idx+1}.jpg?v=4`;image.alt=`Bild zu ${data[id].name}, Karte ${idx+1}`;step.textContent=`${idx+1}/5`;next.textContent=idx===4?'Geschichte beenden ✓':'Nächste Karte →';previous.disabled=idx===0;storyArea.hidden=false;if(scroll)storyArea.scrollIntoView({behavior:'smooth',block:'start'});const key=`${id}-${idx}`;if(!state.seen.includes(key))state.seen.push(key);deck.pos=Math.max(deck.pos,idx+1);save();update()}
function choose(id){selected=id;storyArea.hidden=true;document.querySelectorAll('.storyPreview').forEach(b=>b.classList.toggle('selected',b.dataset.id===id));searchStatus.textContent=`Finde jetzt: ${data[id].name}`;document.getElementById('stage').scrollIntoView({behavior:'smooth',block:'center'})}
function found(id){if(!selected){searchStatus.textContent='Wähle zuerst oben ein Vorschaubild aus.';return}if(id!==selected){searchStatus.textContent='Das gehört zu einer anderen Geschichte. Suche weiter!';searchStatus.classList.remove('tryAgain');void searchStatus.offsetWidth;searchStatus.classList.add('tryAgain');return}const spot=document.querySelector(`.hotspot[data-id="${id}"]`);searchStatus.textContent='Gefunden!';spot.classList.remove('glow');void spot.offsetWidth;spot.classList.add('glow');setTimeout(()=>{spot.classList.remove('glow');show(id)},700)}
document.querySelectorAll('.storyPreview').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.id)));
document.querySelectorAll('.hotspot').forEach(b=>b.addEventListener('click',()=>found(b.dataset.id)));
next.addEventListener('click',()=>{if(currentIndex>=4){storyArea.hidden=true;searchStatus.textContent='Wähle die nächste Geschichte aus.';document.getElementById('gallery').scrollIntoView({behavior:'smooth',block:'center'});return}show(current,false,currentIndex+1)});
previous.addEventListener('click',()=>{if(currentIndex>0)show(current,false,currentIndex-1)});
document.getElementById('replay').addEventListener('click',()=>show(current,false,0));
document.getElementById('close').addEventListener('click',()=>{storyArea.hidden=true;document.getElementById('stage').scrollIntoView({behavior:'smooth',block:'center'})});
document.getElementById('finishClose').addEventListener('click',()=>document.getElementById('finishDialog').close());
document.getElementById('restart').addEventListener('click',()=>{if(confirm('Möchtest du alle Geschichten noch einmal von vorne lesen?')){state=fresh();save();sessionStorage.removeItem(STORAGE+'-celebrated');update()}});
update();
</script></body></html>
